<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin - Chỉnh số tia kỹ năng</title>
<style>
  :root{
    --bg:#f3f5f7; --panel:#fff; --ink:#1b2430; --muted:#6b7684; --line:#dde2e8;
    --accent:#0f766e; --accent-ink:#fff; --warn:#b45309; --bad:#b91c1c; --ok:#15803d;
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#10151b; --panel:#18202a; --ink:#e7ecf2; --muted:#93a0af; --line:#2a3542;
      --accent:#2dd4bf; --accent-ink:#06201d; --warn:#f59e0b; --bad:#f87171; --ok:#4ade80;}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:960px;margin:0 auto;padding:20px 16px 60px}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 16px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  input,button{font:inherit;color:inherit}
  .bar input{flex:1;min-width:180px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
  button{padding:8px 14px;border:1px solid var(--line);border-radius:6px;background:var(--panel);cursor:pointer}
  button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
  button:disabled{opacity:.45;cursor:default}
  button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .tablewrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px}
  table{width:100%;border-collapse:collapse;min-width:640px}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  th{font-weight:600;color:var(--muted);font-size:13px}
  tr:last-child td{border-bottom:0}
  td.num{font-variant-numeric:tabular-nums}
  .hit{width:84px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
  .hit.changed{border-color:var(--warn)}
  .total{font-weight:600}
  .total.up{color:var(--ok)} .total.down{color:var(--bad)}
  .old{color:var(--muted);font-weight:400;font-size:13px;margin-left:6px}
  .msg{margin-top:12px;min-height:22px;color:var(--muted)}
  .msg.err{color:var(--bad)} .msg.ok{color:var(--ok)}
  .note{margin-top:20px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font-size:13px}
  code{font-family:ui-monospace,Consolas,monospace}
</style>
</head>
<body>
<div class="wrap">
  <h1>Chỉnh số tia kỹ năng của tướng</h1>
  <p class="sub">Damage mỗi tia được giữ nguyên. Tổng damage = damage mỗi tia × số tia.</p>

  <div class="bar">
    <input id="q" type="search" placeholder="Tìm tướng theo tên hoặc ID" aria-label="Tìm tướng">
    <button id="reset">Hoàn tác thay đổi</button>
    <button id="saveAll" class="primary" disabled>Lưu tất cả</button>
  </div>

  <div class="tablewrap">
    <table>
      <thead><tr>
        <th>Tướng</th><th>Damage mỗi tia</th><th>Số tia</th><th>Tổng damage</th><th></th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <div id="msg" class="msg" role="status"></div>

  <div class="note">
    <b>Kết nối với game của bạn:</b> sửa phần <code>CONFIG</code> trong đoạn script bên dưới.
    Nếu để <code>API_URL</code> trống, trang chạy chế độ thử bằng dữ liệu mẫu lưu trong trình duyệt.
  </div>
</div>

<script>
/* ============ CẤU HÌNH: sửa phần này cho khớp hệ thống của bạn ============ */
const CONFIG = {
  API_URL: '',            // ví dụ: '/admin/api/heroes'. Để trống = chế độ thử
  MIN_HITS: 1,
  MAX_HITS: 50,
  // Tên các trường trong dữ liệu tướng của bạn:
  F: {
    id: 'id',
    name: 'name',
    hitCount: 'hitCount',          // số tia
    damagePerHit: 'damagePerHit',  // damage mỗi tia
    totalDamage: 'totalDamage'     // chỉ dùng nếu dữ liệu cũ chỉ có tổng
  },
  // Thêm header nếu API cần xác thực, ví dụ: { Authorization: 'Bearer xxx' }
  HEADERS: {}
};
/* ========================================================================== */

const F = CONFIG.F;
let heroes = [];      // dữ liệu hiện tại (đang sửa)
let original = {};    // số tia ban đầu theo id, để so sánh

const $ = s => document.querySelector(s);
const fmt = n => Number(n).toLocaleString('vi-VN', {maximumFractionDigits: 2});
const total = h => h[F.damagePerHit] * h[F.hitCount];

function say(text, type){ const m = $('#msg'); m.textContent = text; m.className = 'msg ' + (type || ''); }

/* Chuẩn hóa dữ liệu cũ: nếu chưa có damage mỗi tia thì tính từ tổng / số tia */
function normalize(h){
  if (h[F.damagePerHit] == null && h[F.totalDamage] != null && h[F.hitCount] > 0){
    h[F.damagePerHit] = h[F.totalDamage] / h[F.hitCount];
  }
  return h;
}

async function load(){
  if (CONFIG.API_URL){
    const r = await fetch(CONFIG.API_URL, {headers: CONFIG.HEADERS});
    if (!r.ok) throw new Error('Không tải được danh sách tướng (' + r.status + ')');
    heroes = (await r.json()).map(normalize);
  } else {
    const saved = localStorage.getItem('demo_heroes');
    heroes = saved ? JSON.parse(saved) : [
      {id:'h01', name:'Tướng Lửa',  hitCount:3, damagePerHit:100},
      {id:'h02', name:'Tướng Băng', hitCount:5, damagePerHit:60},
      {id:'h03', name:'Tướng Sét',  hitCount:2, damagePerHit:250},
      {id:'h04', name:'Tướng Gió',  hitCount:4, damagePerHit:75}
    ];
  }
  original = Object.fromEntries(heroes.map(h => [h[F.id], h[F.hitCount]]));
  render();
}

function isChanged(h){ return h[F.hitCount] !== original[h[F.id]]; }

function render(){
  const kw = $('#q').value.trim().toLowerCase();
  const list = heroes.filter(h =>
    !kw || String(h[F.name]).toLowerCase().includes(kw) || String(h[F.id]).toLowerCase().includes(kw));

  $('#rows').innerHTML = list.map(h => {
    const id = h[F.id], changed = isChanged(h);
    const oldTotal = h[F.damagePerHit] * original[id];
    const cls = !changed ? '' : (total(h) > oldTotal ? 'up' : 'down');
    return `<tr data-id="${id}">
      <td>${esc(h[F.name])}<span class="old">${esc(id)}</span></td>
      <td class="num">${fmt(h[F.damagePerHit])}</td>
      <td><input class="hit ${changed ? 'changed' : ''}" type="number" step="1"
           min="${CONFIG.MIN_HITS}" max="${CONFIG.MAX_HITS}" value="${h[F.hitCount]}"
           aria-label="Số tia của ${esc(h[F.name])}"></td>
      <td class="num total ${cls}">${fmt(total(h))}${changed ? `<span class="old">trước: ${fmt(oldTotal)}</span>` : ''}</td>
      <td><button class="save" ${changed ? '' : 'disabled'}>Lưu</button></td>
    </tr>`;
  }).join('') || '<tr><td colspan="5">Không tìm thấy tướng nào.</td></tr>';

  $('#saveAll').disabled = !heroes.some(isChanged);
}

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function validHits(v){ return Number.isInteger(v) && v >= CONFIG.MIN_HITS && v <= CONFIG.MAX_HITS; }

/* Gửi 1 tướng lên server: chỉ gửi số tia, damage mỗi tia không đổi */
async function saveHero(h){
  const v = h[F.hitCount];
  if (!validHits(v)) throw new Error(`Số tia của ${h[F.name]} phải là số nguyên từ ${CONFIG.MIN_HITS} đến ${CONFIG.MAX_HITS}.`);

  if (CONFIG.API_URL){
    const r = await fetch(`${CONFIG.API_URL}/${encodeURIComponent(h[F.id])}`, {
      method: 'PUT',
      headers: {'Content-Type': 'application/json', ...CONFIG.HEADERS},
      body: JSON.stringify({[F.hitCount]: v})
    });
    if (!r.ok) throw new Error(`Lưu ${h[F.name]} thất bại (${r.status}).`);
  } else {
    localStorage.setItem('demo_heroes', JSON.stringify(heroes));
  }
  original[h[F.id]] = v;
}

$('#rows').addEventListener('input', e => {
  if (!e.target.classList.contains('hit')) return;
  const tr = e.target.closest('tr');
  const h = heroes.find(x => String(x[F.id]) === tr.dataset.id);
  const v = parseInt(e.target.value, 10);
  if (!Number.isInteger(v)) return;
  h[F.hitCount] = v;
  // Cập nhật nhanh dòng này, không vẽ lại cả bảng để không mất con trỏ
  const changed = isChanged(h), oldTotal = h[F.damagePerHit] * original[h[F.id]];
  e.target.classList.toggle('changed', changed);
  const t = tr.querySelector('.total');
  t.className = 'num total ' + (!changed ? '' : total(h) > oldTotal ? 'up' : 'down');
  t.innerHTML = fmt(total(h)) + (changed ? `<span class="old">trước: ${fmt(oldTotal)}</span>` : '');
  tr.querySelector('.save').disabled = !changed;
  $('#saveAll').disabled = !heroes.some(isChanged);
});

$('#rows').addEventListener('click', async e => {
  if (!e.target.classList.contains('save')) return;
  const h = heroes.find(x => String(x[F.id]) === e.target.closest('tr').dataset.id);
  try { await saveHero(h); say(`Đã lưu ${h[F.name]}: ${h[F.hitCount]} tia, tổng ${fmt(total(h))} damage.`, 'ok'); render(); }
  catch (err){ say(err.message, 'err'); }
});

$('#saveAll').addEventListener('click', async () => {
  const todo = heroes.filter(isChanged);
  let done = 0;
  for (const h of todo){
    try { await saveHero(h); done++; } catch (err){ say(err.message, 'err'); render(); return; }
  }
  say(`Đã lưu ${done} tướng.`, 'ok'); render();
});

$('#reset').addEventListener('click', () => {
  heroes.forEach(h => h[F.hitCount] = original[h[F.id]]);
  say('Đã hoàn tác các thay đổi chưa lưu.'); render();
});

$('#q').addEventListener('input', render);

load().catch(err => say(err.message, 'err'));
</script>
</body>
</html>
