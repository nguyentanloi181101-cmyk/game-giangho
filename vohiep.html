<!DOCTYPE html>
<html lang="vi">
<head>

        <!-- Đã gắn hàm goToHome() để bấm về index.html mượt mà -->

        <h2 class="vohiep-title">Quản lý Võ Hiệp</h2>
      </div>

      <!-- Grid 8 Nút Tính Năng -->

          <div class="vh-btn-pill"><span>Mảnh<br>Võ Hiệp</span></div>
        </div>

          <div class="vh-icon-circle">
            <div class="vh-icon-img">🎴</div>
            <span class="badge-red">4</span>
          </div>
          <div class="vh-
